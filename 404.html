<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a2a2c">
<title>404 — Page Not Found</title>
<meta name="description" content="That page does not exist on code.isaiart.com.">
<!-- This page alone keeps ROOT-relative paths: GitHub Pages serves it at
     arbitrary URL depths, so a 404 at /a/b/c must still find /assets/.
     The onerror fallback re-points at a relative path so the file also
     renders when opened straight off disk. -->
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml"
      onerror="this.onerror=null;this.href='assets/icon.svg'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/vector.css"
      onerror="this.onerror=null;this.href='assets/vector.css'">
<script src="/assets/cassette.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='assets/cassette.js';document.head.appendChild(s)"></script>
<style>
    body { display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 100dvh; }

    .panel-404 {
        width: 100%;
        max-width: 900px;
        padding: 22px 26px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .head-stripe { height: 14px; }
    .head-stripe i { width: 5px; min-height: 14px; }

    /* Globe left, message right — the same composition as the index plot, so
       a wrong turn still looks like part of the same machine. */
    .body-404 {
        display: flex;
        align-items: center;
        gap: clamp(20px, 5vw, 56px);
    }
    .globe { display: block; flex: 0 0 auto; width: clamp(150px, 26vh, 250px); aspect-ratio: 1/1; height: auto; }
    .msg { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

    .code {
        font-family: var(--f-display);
        font-size: clamp(3rem, 11vw, 5.5rem);
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1;
        color: var(--phos);
    }
    .said { font-size: 0.85rem; letter-spacing: 0.14em; }
    .path {
        font-size: 0.72rem;
        word-break: break-all;
        padding: 8px 10px;
        background: var(--well);
        border: 1px solid var(--rule);
    }

    .count-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .count-num { font-family: var(--f-display); font-size: 1.1rem; font-weight: 700; color: var(--phos); }
    .count-bar { flex: 1 1 120px; min-width: 90px; }
    .count-bar i { background: var(--phos); }

    .foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .key-home { color: #0a0b0d; background: var(--accent); border-color: var(--accent); }
    .key-home:hover { color: #0a0b0d; background: var(--s2); border-color: var(--s2); }

    @media (max-width: 620px) {
        .body-404 { flex-direction: column; align-items: flex-start; gap: 18px; }
        .globe { align-self: center; width: 130px; }
    }
</style>
</head>
<body>
<main class="panel-404 chassis">

    <div class="row" style="margin-bottom:14px">
        <span class="stripe head-stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="label">CODE.ISAIART.COM</span>
        <span class="spacer"></span>
        <span class="led on red blink" aria-hidden="true"></span>
    </div>

    <div class="body-404">
        <canvas id="globe" class="globe" aria-hidden="true"></canvas>

        <div class="msg" id="well">
            <div class="code">404</div>
            <div class="said label">PAGE NOT FOUND</div>
            <div class="path phos-dim" id="path"></div>

            <div class="count-row" id="countRow">
                <span class="label">RETURNING TO INDEX IN</span>
                <span class="count-num" id="countNum">10</span>
                <span class="meter count-bar"><i id="countBar"></i></span>
            </div>
            <p class="prose" id="countNote" style="margin:0">
                Press any key or click anywhere to stay on this page.
            </p>
        </div>
    </div>

    <div class="rule"></div>

    <div class="foot">
        <a class="key key-home" href="https://code.isaiart.com" id="homeNow">RETURN TO HOME PAGE</a>
        <a class="key" href="/editor/">CODE EDITOR</a>
        <a class="key" href="/mobile/">MOBILE EDITOR</a>
    </div>
</main>

<script>
(function () {
    'use strict';
    var doc = document;
    doc.getElementById('path').textContent = '> ' + location.pathname;
    CAS.bootOnce(doc.getElementById('well'));
    CAS.globe(doc.getElementById('globe'), { parallels: 7, meridians: 8 });
    CAS.pageTransition();

    /* ── Auto-return ──────────────────────────────────────────────────────
       A 404 with no way out is a dead end, so this one walks the user back to
       the index. Any interaction cancels it — an unstoppable redirect is a
       WCAG 2.2.1 failure and it would fight anyone trying to read the URL
       they mistyped. */

    var TOTAL = 10;
    var left = TOTAL;
    var num = doc.getElementById('countNum');
    var bar = doc.getElementById('countBar');
    var row = doc.getElementById('countRow');
    var note = doc.getElementById('countNote');
    var timer = null;

    row.setAttribute('role', 'status');
    row.setAttribute('aria-live', 'polite');
    bar.style.width = '100%';

    function cancel(why) {
        if (!timer) return;
        clearInterval(timer);
        timer = null;
        row.textContent = '';
        var l = doc.createElement('span');
        l.className = 'label';
        l.textContent = 'AUTO-RETURN CANCELLED';
        row.appendChild(l);
        note.textContent = why || 'Use the controls below whenever you are ready.';
    }

    /* The auto-return goes to whatever host this page is actually on, so a
       local copy stays local. The explicit button below is the one that
       always goes to the real code.isaiart.com. */
    function indexUrl() {
        if (location.protocol === 'file:') return 'index.html';
        return '/';
    }

    function tick() {
        left -= 1;
        if (left <= 0) {
            clearInterval(timer);
            timer = null;
            location.href = indexUrl();
            return;
        }
        num.textContent = left;
        bar.style.width = (left / TOTAL * 100) + '%';
    }

    timer = setInterval(tick, 1000);

    ['keydown', 'pointerdown', 'wheel'].forEach(function (evt) {
        doc.addEventListener(evt, function () { cancel(); }, { once: true, passive: true });
    });

    /* Someone who clicks a link is already leaving — don't race them. */
    doc.getElementById('homeNow').addEventListener('click', function () {
        if (timer) { clearInterval(timer); timer = null; }
    });
})();
</script>
</body>
</html>
