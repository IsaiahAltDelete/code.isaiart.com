<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2a2a2c">
<meta name="description" content="A touch-friendly HTML editor for phones. Works offline, installs to your home screen, autosaves as you type.">
<title>Mobile Editor</title>

<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Editor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/vector.css">
<script src="../assets/cassette.js"></script>

<style>
/* ==========================================================================
   Mobile editor — page composition.
   Composes cassette.css primitives only. No new colour values.
   ====================================================================== */

[hidden] { display: none !important; }

html, body {
    overscroll-behavior: none;
}
/* Viewport-locked only where the chrome fits; a heavily zoomed viewport falls
   back to a normally scrolling document rather than clipping the key bank. */
@media (min-height: 400px) {
    html, body { height: 100%; }
    body { height: 100dvh; overflow: hidden; }
}

/* ── The app shell ────────────────────────────────────────────────────── */

.app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    min-height: 0;
}

/* Edge-to-edge on a handheld: the three panels read as one slab. */
.bar, .bank { border-radius: 0; border-left: 0; border-right: 0; }
.editor-area { border-radius: 0; }

@media (min-width: 700px) {
    .app {
        max-width: 1060px;
        margin: 0 auto;
        padding: 14px;
        gap: 8px;
    }
    .bar, .bank { border-radius: 0; border-left: 1px solid var(--chassis-edge); border-right: 1px solid var(--chassis-edge); }
    .editor-area { border-radius: 0; }
}

/* ── Header ───────────────────────────────────────────────────────────── */

.bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 46px;
    padding: 6px 6px;
    padding-top: calc(6px + env(safe-area-inset-top));
    z-index: 4;
}
.bar > * { position: relative; z-index: 1; }

.head-stripe { height: 14px; }
.head-stripe i { width: 4px; min-height: 14px; }

.desig { font-size: 12px; white-space: nowrap; min-width: 0; }
.bar .tape { flex-shrink: 0; }

/* The back control matches the other pages (arrow + TOOLS), but the bar only
   has ~36px of slack at 360px — so the word is what drops first, not the key. */
.key.back { padding-left: 8px; padding-right: 8px; gap: 6px; }
.back-txt { display: none; }
@media (min-width: 400px) { .back-txt { display: inline; } }

@media (max-width: 359px) { .desig { display: none; } }
@media (min-width: 520px) {
    .bar { gap: 8px; padding-left: 10px; padding-right: 10px; }
    .desig { font-size: 13px; }
}

.phos-lbl { display: none; }
@media (min-width: 480px) { .phos-lbl { display: inline; } }

/* ── Punch strip (quick insert) ───────────────────────────────────────── */

.strip {
    flex: 0 0 auto;
    height: 0;
    overflow: hidden;
    transition: height var(--slide);
    z-index: 3;
}
.strip.open { height: var(--strip-h, 46px); }

.strip-inner {
    display: flex;
    gap: 5px;
    align-items: center;
    height: var(--strip-h, 46px);
    padding: 0 6px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    -ms-overflow-style: none;
    transform: translateY(-100%);
    transition: transform var(--slide);
    /* .chassis supplies the plastic — do not hand-copy the gradient here, or
       this strip loses the grain overlay and the top bevel every other beige
       surface has. Only the overrides belong in this rule. */
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    border-bottom: 1px solid var(--chassis-edge);
}
.strip-inner::-webkit-scrollbar { display: none; }
.strip.open .strip-inner { transform: translateY(0); }

.chip {
    flex: 0 0 auto;
    min-height: 32px;
    padding: 0 10px;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0.02em;
    scroll-snap-align: start;
}

/* ── The recessed code well ─────────────────────────────────────── */

.editor-area {
    flex: 1 1 auto;
    min-height: 0;
    padding: 6px;
    display: flex;
}
@media (min-width: 700px) { .editor-area { padding: 10px; } }

.well {
    /* ONE source of truth for code metrics. Gutter and textarea both read it. */
    --code-fs: 16px;
    --code-lh: 25px;
    --code-pad: 10px;
    --gutter-ch: 2;

    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: stretch;
}

.gutter {
    flex: 0 0 auto;
    width: calc(var(--gutter-ch) * 1ch + 14px);
    overflow: hidden;
    position: relative;
    z-index: 1;
    background: var(--wash);
    border-right: 1px solid var(--screen-edge);
}
.well.no-gutter .gutter { display: none; }

.gutter-nums,
#code {
    /* IDENTICAL METRICS — do not split these apart. */
    font-family: var(--f-mono);
    font-size: var(--code-fs);
    font-weight: 400;
    line-height: var(--code-lh);
    padding-top: var(--code-pad);
    padding-bottom: var(--code-pad);
    white-space: pre;
    tab-size: 2;
    -moz-tab-size: 2;
    letter-spacing: 0;
}

.gutter-nums {
    padding-left: 6px;
    padding-right: 8px;
    margin: 0;
    text-align: right;
    color: var(--phos-dim);
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
    will-change: transform;
}

#code {
    flex: 1 1 auto;
    min-width: 0;
    padding-left: 10px;
    padding-right: 12px;
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    color: var(--phos);
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
    overflow: auto;
    overscroll-behavior: contain;
    caret-color: var(--phos);
    scrollbar-width: thin;
    scrollbar-color: var(--phos-faint) transparent;
}
#code::placeholder { color: var(--phos-faint); }
#code::selection { background: var(--phos-dim); color: var(--screen); }
#code::-webkit-scrollbar { width: 6px; height: 6px; }
#code::-webkit-scrollbar-track { background: transparent; }
#code::-webkit-scrollbar-thumb { background: var(--phos-faint); border-radius: 0; }

/* ── Key bank ─────────────────────────────────────────────────────────── */

.bank {
    flex: 0 0 auto;
    position: sticky;
    bottom: 0;
    z-index: 4;
    padding: 5px 6px;
    padding-bottom: calc(5px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.bank > * { position: relative; z-index: 1; }

.rail {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 22px;
}
.bezel.mini { padding: 3px; border-radius: 0; min-width: 0; }
.mini-scr {
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 46vw;
}

.keys {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
}
@media (min-width: 700px) { .keys { gap: 8px; } }

.keys .key {
    flex-direction: column;
    gap: 3px;
    min-height: 48px;
    padding: 5px 2px;
    overflow: hidden;
}
.keys .key svg { width: 18px; height: 18px; }
.klabel {
    font-size: clamp(0.55rem, 2.15vw, 0.6rem);
    letter-spacing: 0.05em;
    line-height: 1;
    max-width: 100%;
    overflow: hidden;
}
@media (min-width: 700px) {
    .keys .key { min-height: 54px; }
    .klabel { font-size: 0.625rem; letter-spacing: var(--label-track); }
}

/* Icon keycaps everywhere else */
.key.key-sq svg { width: 18px; height: 18px; }

/* ── Preview overlay ──────────────────────────────────────────────────── */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 800;
    display: none;
    background: var(--cover);
}
.overlay.open { display: block; }
.overlay .app { height: 100dvh; }

.ov-body { flex: 1 1 auto; min-height: 0; padding: 6px; display: flex; }
@media (min-width: 700px) { .ov-body { padding: 10px; } }
.ov-screen { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; }
#pv-frame {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--paper);
    position: relative;
    z-index: 1;
}

/* ── Service panels ───────────────────────────────────────────────────── */

.panel-modal .sheet { max-width: 360px; }
.sheet .rule { margin: 12px 0; }
.key.wide {
    width: 100%;
    justify-content: flex-start;
    gap: 10px;
    min-height: 44px;
    padding: 0.5em 0.85em;
}
.key.wide svg { width: 18px; height: 18px; }
.key.wide .spacer { flex: 1 1 auto; }

.map-scr { padding: 10px 12px; }
.map-row {
    display: flex;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.06em;
    line-height: 20px;
    text-transform: uppercase;
}
.map-row b { flex: 0 0 76px; font-weight: 600; }

.sheet .field { margin-top: 6px; font-size: 16px; }
.sheet-title { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

<div class="app">

    <!-- ── HEADER ──────────────────────────────────────────────────────── -->
    <header class="chassis bar">
        <a class="key back" href="../" aria-label="Back to all tools">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/><path d="M20 12H8"/></svg>
            <span class="back-txt">Tools</span>
        </a>
        <span class="stripe head-stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <h1 class="designation desig">Mobile Editor</h1>
        <span class="spacer"></span>

        <button class="key key-sq" id="btn-strip" aria-label="Quick insert strip" aria-pressed="false" title="Quick insert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M12 8.5v7"/><path d="M8.5 12h7"/></svg>
        </button>

        <span class="led on green" title="Ready" aria-hidden="true"></span>
        <span class="label phos-lbl">DARK</span>
        <label class="rocker" title="Light mode">
            <input type="checkbox" id="phos-sw" aria-label="Light mode">
            <span class="rock"></span>
        </label>
        <span class="label phos-lbl">LIGHT</span>

        <button class="key key-sq" id="btn-svc" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h9"/><path d="M17 7h4"/><path d="M3 17h5"/><path d="M13 17h8"/><circle cx="14.5" cy="7" r="2.2"/><circle cx="10.5" cy="17" r="2.2"/></svg>
        </button>
    </header>

    <!-- ── PUNCH STRIP ─────────────────────────────────────────────────── -->
    <div class="strip" id="strip">
        <div class="strip-inner chassis" id="strip-inner" role="toolbar" aria-label="Quick insert tags"></div>
    </div>

    <!-- ── EDITOR ──────────────────────────────────────────────────────── -->
    <main class="bezel editor-area">
        <div class="screen flat well" id="well">
            <div class="gutter" id="gutter" aria-hidden="true"><pre class="gutter-nums" id="gnums">1
</pre></div>
            <textarea id="code"
                      wrap="off"
                      spellcheck="false"
                      autocorrect="off"
                      autocapitalize="off"
                      autocomplete="off"
                      inputmode="text"
                      data-gramm="false"
                      aria-label="Code"
                      placeholder="Type or paste HTML"></textarea>
        </div>
    </main>

    <!-- ── KEY BANK ────────────────────────────────────────────────────── -->
    <footer class="chassis bank">
        <div class="rail">
            <span class="label">LN</span>
            <span class="seg" id="seg-lines"></span>
            <span class="sr-only" id="ln-sr">1 lines</span>
            <span class="spacer"></span>
            <div class="bezel mini">
                <div class="screen mini-scr"><span class="phos" id="readout">READY</span></div>
            </div>
            <!-- WR, not SAVE: this lamp is the autosave write, and the keycap
                 three rows down that downloads a file is the SAVE. -->
            <span class="label">WR</span>
            <span class="led green" id="wr-led" aria-hidden="true"></span>
        </div>

        <div class="rule"></div>

        <div class="keys">
            <button class="key" id="k-copy" aria-label="Copy all">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/></svg>
                <span class="klabel">Copy</span>
            </button>
            <button class="key" id="k-paste" aria-label="Paste at cursor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8.5" y="2.5" width="7" height="4" rx="1"/></svg>
                <span class="klabel">Paste</span>
            </button>
            <button class="key" id="k-format" aria-label="Format">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6h17"/><path d="M7.5 11h13"/><path d="M7.5 16h13"/><path d="M3.5 21h17"/></svg>
                <span class="klabel">Format</span>
            </button>
            <button class="key" id="k-preview" aria-label="Preview">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.75"/></svg>
                <span class="klabel">Preview</span>
            </button>
            <button class="key" id="k-save" aria-label="Save file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M7.5 10l4.5 4.5L16.5 10"/><path d="M4 20h16"/></svg>
                <span class="klabel">Save</span>
            </button>
            <button class="key" id="k-undo" aria-label="Undo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5L3.5 10 8 14.5"/><path d="M3.5 10H15a5 5 0 0 1 0 10H9"/></svg>
                <span class="klabel">Undo</span>
            </button>
            <button class="key" id="k-redo" aria-label="Redo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5.5L20.5 10 16 14.5"/><path d="M20.5 10H9a5 5 0 0 0 0 10h6"/></svg>
                <span class="klabel">Redo</span>
            </button>
        </div>
    </footer>
</div>

<!-- ── PREVIEW OUT ─────────────────────────────────────────────────────── -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Preview">
    <div class="app">
        <header class="chassis bar">
            <span class="tape tape-cool">VIEW</span>
            <span class="designation desig">Preview</span>
            <span class="spacer"></span>
            <button class="key key-sq" id="pv-tab" aria-label="Open preview in new tab" title="Open in new tab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.5h6.5V10"/><path d="M20.5 3.5L11 13"/><path d="M18 14v5.5a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1H10"/></svg>
            </button>
            <button class="key key-sq" id="pv-close" aria-label="Close preview" title="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
            </button>
        </header>
        <main class="bezel editor-area ov-body">
            <div class="screen flat ov-screen">
                <iframe id="pv-frame" title="Sandboxed preview output"></iframe>
            </div>
        </main>
    </div>
</div>

<!-- ── SERVICE PANEL ───────────────────────────────────────────────────── -->
<div class="panel-modal" id="svc-panel">
    <div class="sheet chassis" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="sheet-title">
            <span class="tape tape-alt">SET</span>
            <span class="designation" style="font-size:13px">Settings</span>
            <span class="spacer"></span>
            <button class="key key-sq" data-close aria-label="Close panel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="rule"></div>
        <div class="stack">
            <button class="key wide" id="s-lines" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5h11"/><path d="M9.5 12h11"/><path d="M9.5 17.5h11"/><path d="M3.5 5l1.5-1v5"/><path d="M3.5 15.5a1.4 1.4 0 1 1 2.4 1L3.5 20h2.6"/></svg>
                <span>Line Numbers</span><span class="spacer"></span><span class="label" id="s-lines-state">On</span>
            </button>
            <button class="key wide" id="s-map">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01"/><path d="M10.5 10h.01"/><path d="M14.5 10h.01"/><path d="M18 10h.01"/><path d="M8 14h8"/></svg>
                <span>Shortcuts</span>
            </button>
            <button class="key wide" id="s-install" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7"/><path d="M9.5 11.5L12 14l2.5-2.5"/></svg>
                <span>Install App</span>
            </button>
        </div>
        <div class="rule"></div>
        <button class="key wide key-danger" id="s-clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5h17"/><path d="M9 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h3.4A1.3 1.3 0 0 1 15 4.8v1.7"/><path d="M5.8 6.5L7 20.5h10l1.2-14"/></svg>
            <span id="s-clear-label">Clear All</span>
        </button>
    </div>
</div>

<!-- ── KEY MAP PANEL ───────────────────────────────────────────────────── -->
<div class="panel-modal" id="map-panel">
    <div class="sheet chassis" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
        <div class="sheet-title">
            <span class="tape tape-cool">KEYS</span>
            <span class="designation" style="font-size:13px">Shortcuts</span>
            <span class="spacer"></span>
            <button class="key key-sq" data-close aria-label="Close panel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="rule"></div>
        <div class="bezel">
            <div class="screen map-scr">
                <div class="map-row phos"><b>Tab</b><span>Insert 2 spaces</span></div>
                <div class="map-row phos"><b>Ctrl S</b><span>Save file</span></div>
                <div class="map-row phos"><b>Ctrl Z</b><span>Undo</span></div>
                <div class="map-row phos"><b>Ctrl Y</b><span>Redo</span></div>
                <div class="map-row phos"><b>Ctrl Ent</b><span>Preview</span></div>
                <div class="map-row phos"><b>Esc</b><span>Close panel</span></div>
            </div>
        </div>
    </div>
</div>

<!-- ── SAVE PANEL ──────────────────────────────────────────────────────── -->
<div class="panel-modal" id="save-panel">
    <div class="sheet chassis" role="dialog" aria-modal="true" aria-label="Save file">
        <div class="sheet-title">
            <span class="tape">SAVE</span>
            <span class="designation" style="font-size:13px">Save File</span>
            <span class="spacer"></span>
            <button class="key key-sq" data-close aria-label="Close panel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="rule"></div>
        <label class="label" for="fname">Filename</label>
        <input type="text" id="fname" class="field" value="index.html" placeholder="index.html"
               spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
        <div class="rule"></div>
        <div class="row">
            <button class="key" data-close style="flex:1">Cancel</button>
            <button class="key" id="save-go" style="flex:1">Save</button>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var BUF_KEY = 'codetools.mobile.content';
    var LN_KEY  = 'codetools.mobile.gutter';

    var $ = function (id) { return document.getElementById(id); };

    var editor    = $('code');
    var well      = $('well');
    var gnums     = $('gnums');
    var stripEl   = $('strip');
    var stripIn   = $('strip-inner');
    var readout   = $('readout');
    var wrLed     = $('wr-led');
    var segLines  = $('seg-lines');
    var lnSr      = $('ln-sr');
    var overlay   = $('overlay');
    var frame     = $('pv-frame');

    /* ── Storage helpers (private mode can throw) ─────────────────────── */

    function store(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }
    function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    /* ── Undo / redo stack ────────────────────────────────────────────── */

    var undoStack = [''], redoStack = [];

    function commit() {
        var v = editor.value;
        if (undoStack[undoStack.length - 1] === v) return;
        undoStack.push(v);
        if (undoStack.length > 120) undoStack.shift();
        redoStack.length = 0;
    }
    var commitSoon = CAS.debounce(commit, 400);

    function doUndo() {
        commit();
        if (undoStack.length < 2) { CAS.toast('NO HISTORY', true); return; }
        redoStack.push(undoStack.pop());
        applyValue(undoStack[undoStack.length - 1]);
        CAS.toast('UNDO');
    }

    function doRedo() {
        if (!redoStack.length) { CAS.toast('NO REDO', true); return; }
        var v = redoStack.pop();
        undoStack.push(v);
        applyValue(v);
        CAS.toast('REDO');
    }

    /* ── Line gutter — transform-synced, never scrollTop-clamped ──────── */

    var lastCount = -1;

    function renderGutter(count) {
        if (count === lastCount) return;
        lastCount = count;
        var s = '', i;
        for (i = 1; i <= count; i++) s += i + '\n';
        gnums.textContent = s;
        well.style.setProperty('--gutter-ch', Math.max(2, String(count).length));
    }

    /* Translating the number column instead of scrolling it means the gutter
       can never run out of scroll range when the textarea grows a horizontal
       scrollbar. That mismatch is what desynced the retired editor. */
    function syncGutter() {
        gnums.style.transform = 'translate3d(0,' + (-editor.scrollTop) + 'px,0)';
    }

    /* ── Status ───────────────────────────────────────────────────────── */

    var readoutHold = null;

    function bufferLabel() {
        var n = editor.value.length;
        if (!n) return 'Ready';
        if (n < 1024) return n + ' B';
        return (n / 1024).toFixed(1) + 'K';
    }

    function updateStatus() {
        var count = editor.value.split('\n').length;
        renderGutter(count);
        CAS.segSet(segLines, count);
        lnSr.textContent = count + (count === 1 ? ' line' : ' lines');
        if (!readoutHold) readout.textContent = bufferLabel();
    }

    function flashWrite() {
        wrLed.classList.add('on');
        readout.textContent = 'WR OK';
        clearTimeout(readoutHold);
        readoutHold = setTimeout(function () {
            wrLed.classList.remove('on');
            readoutHold = null;
            readout.textContent = bufferLabel();
        }, 900);
    }

    /* ── Autosave ─────────────────────────────────────────────────────── */

    var storeFailed = false;

    var persist = CAS.debounce(function () {
        if (store(BUF_KEY, editor.value)) { flashWrite(); }
        else if (!storeFailed) { storeFailed = true; CAS.toast('STORAGE UNAVAILABLE', true); }
    }, 300);

    /* The debounce is the whole exposure: a phone that discards this tab within
       300ms of the last keystroke would lose it. Flush on the way out. */
    function flush() { store(BUF_KEY, editor.value); }
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') flush();
    });

    /* ── Mutation entry points ────────────────────────────────────────── */

    function afterChange() {
        updateStatus();
        syncGutter();
        persist();
    }

    function applyValue(v) {
        editor.value = v;
        afterChange();
    }

    function insertAt(text, offset) {
        commit();
        var s = editor.selectionStart, e = editor.selectionEnd, v = editor.value;
        var pos = s + text.length + (offset || 0);
        if (pos < 0) pos = 0;
        editor.value = v.slice(0, s) + text + v.slice(e);
        editor.focus();
        try { editor.setSelectionRange(pos, pos); } catch (err) {}
        afterChange();
        commit();
    }

    editor.addEventListener('input', function () { afterChange(); commitSoon(); });
    editor.addEventListener('scroll', syncGutter, { passive: true });
    window.addEventListener('resize', syncGutter);

    /* Tab indents, but Shift+Tab must stay a focus move — otherwise a hardware
       keyboard has no way out of the textarea. */
    editor.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
        e.preventDefault();
        insertAt('  ', 0);
    });

    /* ── HTML formatter ───────────────────────────────────────────────────
       A line only gains indent when it opens a tag that is NOT closed on the
       same line. Net depth per line, plus the running minimum, decides both
       this line's indent and the next line's.
       ------------------------------------------------------------------ */

    var VOID = { area:1, base:1, br:1, col:1, embed:1, hr:1, img:1, input:1,
                 link:1, meta:1, param:1, source:1, track:1, wbr:1 };
    var RAWTEXT = { script:1, style:1, pre:1, textarea:1 };
    var NAME_RE = /^<\/?([A-Za-z][A-Za-z0-9:._-]*)/;

    function pad(n) { return n > 0 ? new Array(n + 1).join('  ') : ''; }

    /* Index of a tag's '>' , skipping quoted attribute values. */
    function tagEnd(s, start) {
        var q = null, k, c;
        for (k = start + 1; k < s.length; k++) {
            c = s.charAt(k);
            if (q) { if (c === q) q = null; continue; }
            if (c === '"' || c === "'") { q = c; continue; }
            if (c === '>') return k;
        }
        return -1;
    }

    function closerIndex(line, name) {
        return line.search(new RegExp('<\\/\\s*' + name + '\\b', 'i'));
    }

    function formatHTML(src) {
        var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
        var out = [];
        var indent = 0;
        var inComment = false;
        var raw = null;
        var blankRun = 0;
        var i;

        for (i = 0; i < lines.length; i++) {
            var orig = lines[i];
            var line = orig.replace(/^[ \t]+/, '').replace(/[ \t]+$/, '');

            /* Raw-text element: do not parse its contents as markup. */
            if (raw) {
                var verbatim = (raw === 'pre' || raw === 'textarea');
                var ci = line ? closerIndex(line, raw) : -1;
                if (ci === -1) {
                    out.push(verbatim ? orig : (line ? pad(indent) + line : ''));
                    continue;
                }
                raw = null;
                indent = Math.max(0, indent - 1);
                out.push(verbatim && ci > 0 ? orig : pad(indent) + line);
                continue;
            }

            if (!line) {
                blankRun++;
                if (blankRun === 1 && out.length) out.push('');
                continue;
            }
            blankRun = 0;

            var net = 0, minNet = 0, openRaw = null, j = 0;

            while (j < line.length) {
                if (inComment) {
                    var ce = line.indexOf('-->', j);
                    if (ce === -1) { j = line.length; break; }
                    inComment = false;
                    j = ce + 3;
                    continue;
                }
                var lt = line.indexOf('<', j);
                if (lt === -1) break;

                if (line.substr(lt, 4) === '<!--') { inComment = true; j = lt + 4; continue; }

                var next = line.charAt(lt + 1);
                if (next === '!' || next === '?') {            /* doctype, CDATA, PI */
                    var de = line.indexOf('>', lt);
                    j = de === -1 ? line.length : de + 1;
                    continue;
                }

                var nm = NAME_RE.exec(line.slice(lt));
                if (!nm) { j = lt + 1; continue; }

                var te = tagEnd(line, lt);
                var tagText = te === -1 ? line.slice(lt) : line.slice(lt, te + 1);
                var name = nm[1].toLowerCase();
                var isClose = next === '/';

                if (isClose) {
                    if (openRaw === name) openRaw = null;
                    net--;
                    if (net < minNet) minNet = net;
                } else if (!VOID[name] && !/\/\s*>$/.test(tagText)) {
                    net++;
                    if (RAWTEXT[name]) {
                        /* A script/style body is NOT markup. Consume it here —
                           scanning on would read `if (a<b)` as a <b> tag and
                           leave the formatter stuck in raw mode for the rest
                           of the document. */
                        var after = te === -1 ? line.length : te + 1;
                        var rest  = line.slice(after);
                        var rc    = closerIndex(rest, name);
                        if (rc === -1) { openRaw = name; j = line.length; continue; }
                        net--;                       /* opened and closed here */
                        var ce2 = rest.indexOf('>', rc);
                        j = after + (ce2 === -1 ? rest.length : ce2 + 1);
                        continue;
                    }
                }

                j = te === -1 ? line.length : te + 1;
            }

            var lineIndent = indent + (minNet < 0 ? minNet : 0);
            if (lineIndent < 0) lineIndent = 0;
            out.push(pad(lineIndent) + line);

            indent += net;
            if (indent < 0) indent = 0;
            if (openRaw) raw = openRaw;
        }

        while (out.length && out[out.length - 1] === '') out.pop();
        return out.length ? out.join('\n') + '\n' : '';
    }

    /* ── Punch strip ──────────────────────────────────────────────────── */

    var SNIPPETS = [
        { cap: '<div>',    text: '<div></div>',                        off: -6  },
        { cap: '<p>',      text: '<p></p>',                            off: -4  },
        { cap: '<span>',   text: '<span></span>',                      off: -7  },
        { cap: '<h1>',     text: '<h1></h1>',                          off: -5  },
        { cap: '<a>',      text: '<a href=""></a>',                    off: -4  },
        /* off = intended caret index - text.length. Check it that way, not by
           eye: several of these were one short and landed the caret inside the
           closing tag, so the next keystroke produced things like </fooli>. */
        { cap: '<img>',    text: '<img src="" alt="">',                off: -9  },
        { cap: '<ul>',     text: '<ul>\n  <li></li>\n</ul>',           off: -11 },
        { cap: '<btn>',    text: '<button></button>',                  off: -9  },
        { cap: '<input>',  text: '<input type="text" placeholder="">', off: -2  },
        { cap: '<style>',  text: '<style>\n\n</style>',                off: -9  },
        { cap: '<script>', text: '<script>\n\n<\/script>',             off: -10 },
        { cap: '<!--->',   text: '<!-- -->',                           off: -4  }
    ];

    SNIPPETS.forEach(function (sn) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'key chip';
        b.textContent = sn.cap;
        b.setAttribute('aria-label', 'Insert ' + sn.cap);
        b.addEventListener('click', function () { insertAt(sn.text, sn.off); });
        stripIn.appendChild(b);
    });

    var stripBtn = $('btn-strip');
    /* height:0 + overflow:hidden clips paint but keeps the 12 chips in the tab
       order. inert removes them without killing the height transition. */
    stripEl.inert = true;
    stripBtn.addEventListener('click', function () {
        var open = !stripEl.classList.contains('open');
        stripEl.classList.toggle('open', open);
        stripEl.inert = !open;
        stripBtn.setAttribute('aria-pressed', open ? 'true' : 'false');
    });

    /* ── Service panels ───────────────────────────────────────────────── */

    var openPanelEl = null, lastFocus = null;

    function openPanel(el, focusSel) {
        closePanel();
        lastFocus = document.activeElement;
        el.classList.add('open');
        openPanelEl = el;
        var target = focusSel ? el.querySelector(focusSel) : el.querySelector('.key, .field');
        if (target) setTimeout(function () { target.focus(); }, 30);
    }

    function closePanel() {
        if (!openPanelEl) return;
        openPanelEl.classList.remove('open');
        openPanelEl = null;
        if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
        lastFocus = null;
    }

    Array.prototype.forEach.call(document.querySelectorAll('.panel-modal'), function (p) {
        p.addEventListener('click', function (e) { if (e.target === p) closePanel(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
        b.addEventListener('click', closePanel);
    });

    $('btn-svc').addEventListener('click', function () { openPanel($('svc-panel')); });
    $('s-map').addEventListener('click', function () { openPanel($('map-panel')); });

    /* ── Line numbers preference ──────────────────────────────────────── */

    var linesBtn = $('s-lines'), linesState = $('s-lines-state');

    function setLines(on, announce) {
        well.classList.toggle('no-gutter', !on);
        linesBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        linesState.textContent = on ? 'On' : 'Off';
        store(LN_KEY, on ? '1' : '0');
        if (announce) CAS.toast(on ? 'LINE NUMBERS ON' : 'LINE NUMBERS OFF');
    }

    linesBtn.addEventListener('click', function () {
        setLines(well.classList.contains('no-gutter'), true);
    });

    /* ── Clear buffer (two-stage, no confirm dialog) ──────────────────── */

    var clearBtn = $('s-clear'), clearLabel = $('s-clear-label'), clearArm = null;

    clearBtn.addEventListener('click', function () {
        if (!editor.value) { CAS.toast('NOTHING TO CLEAR', true); return; }
        if (!clearArm) {
            clearLabel.textContent = 'Tap Again To Clear';
            CAS.toast('TAP AGAIN TO CLEAR', true);
            clearArm = setTimeout(function () {
                clearArm = null;
                clearLabel.textContent = 'Clear All';
            }, 3500);
            return;
        }
        clearTimeout(clearArm);
        clearArm = null;
        clearLabel.textContent = 'Clear All';
        commit();
        applyValue('');
        commit();
        closePanel();
        CAS.toast('CLEARED');
    });

    /* ── Install (PWA) ────────────────────────────────────────────────── */

    var installBtn = $('s-install'), deferredPrompt = null;

    function standalone() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        if (standalone()) return;
        deferredPrompt = e;
        installBtn.hidden = false;
    });

    window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        installBtn.hidden = true;
        CAS.toast('INSTALLED');
    });

    installBtn.addEventListener('click', function () {
        if (!deferredPrompt) { installBtn.hidden = true; return; }
        var p = deferredPrompt;
        deferredPrompt = null;
        installBtn.hidden = true;
        p.prompt();
        if (p.userChoice && p.userChoice.then) {
            p.userChoice.then(function (r) {
                CAS.toast(r && r.outcome === 'accepted' ? 'INSTALLING' : 'INSTALL CANCELLED', !(r && r.outcome === 'accepted'));
            });
        }
    });

    /* ── Key bank actions ─────────────────────────────────────────────── */

    $('k-copy').addEventListener('click', function () {
        if (!editor.value) { CAS.toast('NOTHING TO COPY', true); return; }
        CAS.copy(editor.value)
            .then(function () { CAS.toast('COPIED'); })
            .catch(function () { CAS.toast('COPY BLOCKED', true); });
    });

    $('k-paste').addEventListener('click', function () {
        CAS.paste()
            .then(function (text) {
                if (!text) { CAS.toast('CLIPBOARD EMPTY', true); return; }
                insertAt(text, 0);
                CAS.toast('PASTED');
            })
            .catch(function () { CAS.toast('USE LONG-PRESS TO PASTE', true); });
    });

    $('k-format').addEventListener('click', function () {
        if (!editor.value.trim()) { CAS.toast('NOTHING TO FORMAT', true); return; }
        var next = formatHTML(editor.value);
        if (next === editor.value) { CAS.toast('ALREADY FORMATTED'); return; }
        commit();
        applyValue(next);
        commit();
        CAS.toast('FORMATTED');
    });

    $('k-undo').addEventListener('click', doUndo);
    $('k-redo').addEventListener('click', doRedo);

    /* ── Preview out ──────────────────────────────────────────────────── */

    function openPreview() {
        if (!editor.value.trim()) { CAS.toast('NOTHING TO PREVIEW', true); return; }
        CAS.renderPreview(frame, editor.value);
        overlay.classList.add('open');
        setTimeout(function () { $('pv-close').focus(); }, 30);
    }

    function closePreview() {
        overlay.classList.remove('open');
        frame.srcdoc = '';
        editor.focus();
    }

    $('k-preview').addEventListener('click', openPreview);
    $('pv-close').addEventListener('click', closePreview);
    $('pv-tab').addEventListener('click', function () {
        var w = CAS.openInTab(editor.value);
        if (!w) CAS.toast('POP-UP BLOCKED', true);
    });

    /* ── Save ─────────────────────────────────────────────────────────── */

    var fname = $('fname');

    $('k-save').addEventListener('click', function () {
        if (!fname.value.trim()) fname.value = 'index.html';
        openPanel($('save-panel'), '#fname');
    });

    function doSave() {
        var name = fname.value.trim() || 'index.html';
        name = name.replace(/[\\/:*?"<>|]+/g, '-');
        if (!/\.[a-z0-9]{1,8}$/i.test(name)) name += '.html';
        CAS.download(name, editor.value, 'text/html;charset=utf-8');
        closePanel();
        CAS.toast('SAVED ' + name.toUpperCase());
    }

    $('save-go').addEventListener('click', doSave);
    fname.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doSave(); }
    });

    /* ── Dark / light rocker ──────────────────────────────────────────── */

    var phosSw = $('phos-sw');
    phosSw.checked = CAS.getTheme() === 'light';
    phosSw.addEventListener('change', function () {
        /* Drive from the checkbox, not from a toggle: where storage is blocked
           the runtime can't read its own state back, and a toggle there fights
           the switch the user just threw. */
        var mode = CAS.setTheme(phosSw.checked ? 'light' : 'dark');
        phosSw.checked = mode === 'light';
        CAS.toast(mode === 'light' ? 'LIGHT MODE' : 'DARK MODE');
    });

    /* ── Global keys ──────────────────────────────────────────────────── */

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            if (overlay.classList.contains('open')) { closePreview(); return; }
            if (openPanelEl) { closePanel(); return; }
            return;
        }
        if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
        var k = (e.key || '').toLowerCase();
        if (k === 's') { e.preventDefault(); $('k-save').click(); }
        else if (k === 'enter') { e.preventDefault(); openPreview(); }
        else if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
        else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); doRedo(); }
    });

    /* ── Boot ─────────────────────────────────────────────────────────── */

    CAS.segInit(segLines, 4);

    var saved = recall(BUF_KEY);
    if (saved) { editor.value = saved; undoStack = [saved]; }

    setLines(recall(LN_KEY) !== '0', false);

    updateStatus();
    syncGutter();

    if (saved) CAS.toast('RESTORED');

    CAS.bootOnce(well);
    CAS.registerSW('../sw.js');
    CAS.pageTransition();
})();
</script>
</body>
</html>
