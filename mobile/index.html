<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>HTML Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg:        #0d0d10;
            --surface:   #14141a;
            --surface2:  #1c1c26;
            --border:    rgba(255,255,255,0.08);
            --text:      #e2e2ef;
            --muted:     #555570;
            --accent:    #7b6cff;
            --accent2:   #ff6cb3;
            --green:     #55e8a0;
            --yellow:    #ffd970;
            --teal:      #50e0d8;
            --red:       #ff6b6b;
            --blue:      #6cbcff;
            --radius:    12px;
            --toolbar-h: 64px;
            --header-h:  48px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            height: var(--header-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .header-title .dot {
            width: 8px; height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            min-width: 36px; min-height: 36px;
            font-size: 1.1rem;
        }
        .header-btn:active { background: rgba(255,255,255,0.06); }
        .header-btn.active { color: var(--accent); }

        /* ── Editor Area ── */
        .editor-wrap {
            display: flex;
            flex-direction: row;
            /* fill space between header and toolbar */
            height: calc(100dvh - var(--header-h) - var(--toolbar-h));
            overflow: hidden;
            position: relative;
        }

        .line-numbers {
            background: var(--surface);
            color: var(--muted);
            padding: 1rem 0.6rem 1rem 0.4rem;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.6;
            border-right: 1px solid var(--border);
            user-select: none;
            overflow-y: hidden;
            min-width: 36px;
            flex-shrink: 0;
            transition: width 0.2s, min-width 0.2s, padding 0.2s;
        }
        .line-numbers.hidden {
            width: 0; min-width: 0; padding: 0; border: none; overflow: hidden;
        }

        #code-editor {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            padding: 1rem;
            border: none;
            outline: none;
            resize: none;
            overflow: auto;
            white-space: pre;
            tab-size: 2;
            caret-color: var(--accent);
            /* Custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--surface2) transparent;
        }
        #code-editor::-webkit-scrollbar { width: 4px; height: 4px; }
        #code-editor::-webkit-scrollbar-track { background: transparent; }
        #code-editor::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

        #code-editor::placeholder { color: var(--muted); }

        /* ── Bottom Toolbar ── */
        .toolbar {
            height: var(--toolbar-h);
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 0.25rem;
            flex-shrink: 0;
            gap: 0.1rem;
        }

        .tool-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 0.5rem 0.6rem;
            border-radius: 10px;
            min-width: 48px;
            min-height: 52px;
            transition: background 0.15s, transform 0.1s;
            flex: 1;
        }
        .tool-btn:active { background: rgba(255,255,255,0.07); transform: scale(0.93); }

        .tool-btn .material-symbols-outlined {
            font-size: 1.45rem;
        }
        .tool-btn span.label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.58rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        #btn-copy    .material-symbols-outlined { color: var(--blue); }
        #btn-paste   .material-symbols-outlined { color: var(--green); }
        #btn-format  .material-symbols-outlined { color: var(--yellow); }
        #btn-preview .material-symbols-outlined { color: var(--teal); }
        #btn-download .material-symbols-outlined { color: var(--accent); }
        #btn-undo    .material-symbols-outlined { color: var(--red); }
        #btn-redo    .material-symbols-outlined { color: var(--accent2); }

        #btn-copy    span.label { color: var(--blue); }
        #btn-paste   span.label { color: var(--green); }
        #btn-format  span.label { color: var(--yellow); }
        #btn-preview span.label { color: var(--teal); }
        #btn-download span.label { color: var(--accent); }
        #btn-undo    span.label { color: var(--red); }
        #btn-redo    span.label { color: var(--accent2); }

        /* ── Quick Insert Bar ── */
        .quick-bar {
            position: absolute;
            top: 0;
            left: 0; right: 0;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0;
            overflow-x: auto;
            scrollbar-width: none;
            z-index: 10;
            transform: translateY(-100%);
            transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .quick-bar::-webkit-scrollbar { display: none; }
        .quick-bar.open { transform: translateY(0); }

        .quick-chip {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            padding: 0.6rem 0.9rem;
            cursor: pointer;
            border-right: 1px solid var(--border);
            transition: background 0.12s;
            white-space: nowrap;
        }
        .quick-chip:active { background: rgba(123,108,255,0.15); }

        /* ── Modal ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .modal.open { display: flex; }

        .modal-sheet {
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            padding: 1.5rem;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border);
            border-bottom: none;
            animation: slideUp 0.22s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px; height: 4px;
            background: var(--muted);
            border-radius: 2px;
            margin: 0 auto 1rem;
        }
        .modal-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }
        .modal-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 1rem;
            transition: border-color 0.15s;
        }
        .modal-input:focus { border-color: var(--accent); }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }
        .modal-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: var(--radius);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .modal-btn:active { opacity: 0.8; transform: scale(0.97); }
        .modal-confirm { background: var(--accent); color: white; }
        .modal-cancel  { background: var(--surface2); color: var(--muted); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: calc(var(--toolbar-h) + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface2);
            color: var(--text);
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 500;
            border: 1px solid var(--border);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 200;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Desktop tweaks ── */
        @media (min-width: 769px) {
            .editor-wrap {
                max-width: 900px;
                margin: 0 auto;
                width: 100%;
            }
            .toolbar {
                max-width: 900px;
                margin: 0 auto;
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }
            .tool-btn { min-width: 56px; }
            #code-editor { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-title">
        <div class="dot"></div>
        HTML Editor
    </div>
    <div class="header-actions">
        <button class="header-btn" id="btn-toggle-lines" title="Toggle line numbers">
            <span class="material-symbols-outlined">format_list_numbered</span>
        </button>
        <button class="header-btn" id="btn-toggle-quick" title="Quick insert">
            <span class="material-symbols-outlined">add_box</span>
        </button>
        <button class="header-btn" id="btn-clear" title="Clear editor">
            <span class="material-symbols-outlined">delete_sweep</span>
        </button>
    </div>
</div>

<!-- Editor -->
<div class="editor-wrap">

    <!-- Quick Insert Bar (slides down from top) -->
    <div class="quick-bar" id="quick-bar">
        <button class="quick-chip" data-insert="&lt;div&gt;&lt;/div&gt;" data-cursor="-6">&lt;div&gt;</button>
        <button class="quick-chip" data-insert="&lt;p&gt;&lt;/p&gt;" data-cursor="-4">&lt;p&gt;</button>
        <button class="quick-chip" data-insert="&lt;span&gt;&lt;/span&gt;" data-cursor="-7">&lt;span&gt;</button>
        <button class="quick-chip" data-insert="&lt;h1&gt;&lt;/h1&gt;" data-cursor="-5">&lt;h1&gt;</button>
        <button class="quick-chip" data-insert="&lt;a href=&quot;&quot;&gt;&lt;/a&gt;" data-cursor="-4">&lt;a&gt;</button>
        <button class="quick-chip" data-insert="&lt;img src=&quot;&quot; alt=&quot;&quot;&gt;" data-cursor="-8">&lt;img&gt;</button>
        <button class="quick-chip" data-insert="&lt;ul&gt;&#10;  &lt;li&gt;&lt;/li&gt;&#10;&lt;/ul&gt;" data-cursor="-10">&lt;ul&gt;</button>
        <button class="quick-chip" data-insert="&lt;button&gt;&lt;/button&gt;" data-cursor="-9">&lt;btn&gt;</button>
        <button class="quick-chip" data-insert="&lt;input type=&quot;text&quot; placeholder=&quot;&quot;&gt;" data-cursor="-2">&lt;input&gt;</button>
        <button class="quick-chip" data-insert="&lt;style&gt;&#10;&#10;&lt;/style&gt;" data-cursor="-8">&lt;style&gt;</button>
        <button class="quick-chip" data-insert="&lt;script&gt;&#10;&#10;&lt;/script&gt;" data-cursor="-9">&lt;script&gt;</button>
        <button class="quick-chip" data-insert="&lt;!-- --&gt;" data-cursor="-4">&lt;!--&gt;</button>
    </div>

    <pre id="line-numbers" class="line-numbers"></pre>
    <textarea id="code-editor" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="Enter your HTML here…"></textarea>
</div>

<!-- Bottom Toolbar -->
<div class="toolbar">
    <button class="tool-btn" id="btn-copy">
        <span class="material-symbols-outlined">content_copy</span>
        <span class="label">Copy</span>
    </button>
    <button class="tool-btn" id="btn-paste">
        <span class="material-symbols-outlined">content_paste</span>
        <span class="label">Paste</span>
    </button>
    <button class="tool-btn" id="btn-format">
        <span class="material-symbols-outlined">format_align_left</span>
        <span class="label">Format</span>
    </button>
    <button class="tool-btn" id="btn-preview">
        <span class="material-symbols-outlined">open_in_new</span>
        <span class="label">Preview</span>
    </button>
    <button class="tool-btn" id="btn-download">
        <span class="material-symbols-outlined">download</span>
        <span class="label">Save</span>
    </button>
    <button class="tool-btn" id="btn-undo">
        <span class="material-symbols-outlined">undo</span>
        <span class="label">Undo</span>
    </button>
    <button class="tool-btn" id="btn-redo">
        <span class="material-symbols-outlined">redo</span>
        <span class="label">Redo</span>
    </button>
</div>

<!-- Download Modal -->
<div class="modal" id="modal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Save File</div>
        <input type="text" id="filename-input" class="modal-input" placeholder="index.html">
        <div class="modal-actions">
            <button class="modal-btn modal-cancel" id="modal-cancel">Cancel</button>
            <button class="modal-btn modal-confirm" id="modal-confirm">Download</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const editor      = document.getElementById('code-editor');
    const lineNums    = document.getElementById('line-numbers');
    const quickBar    = document.getElementById('quick-bar');
    const modal       = document.getElementById('modal');
    const filenameIn  = document.getElementById('filename-input');
    const toast       = document.getElementById('toast');

    // ── Undo / Redo ──────────────────────────────────────────────
    let undoStack = [''], redoStack = [];
    let debounceTimer;

    function saveState() {
        undoStack.push(editor.value);
        if (undoStack.length > 100) undoStack.shift();
        redoStack = [];
    }

    editor.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(saveState, 400);
        updateLineNumbers();
        syncScroll();
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
        if (undoStack.length > 1) {
            redoStack.push(undoStack.pop());
            editor.value = undoStack[undoStack.length - 1];
            updateLineNumbers();
            showToast('Undone');
        }
    });

    document.getElementById('btn-redo').addEventListener('click', () => {
        if (redoStack.length > 0) {
            const state = redoStack.pop();
            undoStack.push(state);
            editor.value = state;
            updateLineNumbers();
            showToast('Redone');
        }
    });

    // ── Tab Key ──────────────────────────────────────────────────
    editor.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const s = editor.selectionStart, end = editor.selectionEnd;
            editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = s + 2;
            updateLineNumbers();
        }
    });

    // ── Line Numbers ─────────────────────────────────────────────
    function updateLineNumbers() {
        const count = (editor.value.match(/\n/g) || []).length + 1;
        let s = '';
        for (let i = 1; i <= count; i++) s += i + '\n';
        lineNums.textContent = s;
    }

    function syncScroll() {
        lineNums.scrollTop = editor.scrollTop;
    }
    editor.addEventListener('scroll', syncScroll);

    // ── Line Numbers Toggle ──────────────────────────────────────
    let linesVisible = true;
    document.getElementById('btn-toggle-lines').addEventListener('click', () => {
        linesVisible = !linesVisible;
        lineNums.classList.toggle('hidden', !linesVisible);
        document.getElementById('btn-toggle-lines').classList.toggle('active', linesVisible);
        showToast(linesVisible ? 'Line numbers on' : 'Line numbers off');
    });

    // ── Quick Insert Bar ──────────────────────────────────────────
    let quickOpen = false;
    document.getElementById('btn-toggle-quick').addEventListener('click', () => {
        quickOpen = !quickOpen;
        quickBar.classList.toggle('open', quickOpen);
        document.getElementById('btn-toggle-quick').classList.toggle('active', quickOpen);
    });

    document.querySelectorAll('.quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const text   = chip.dataset.insert;
            const offset = parseInt(chip.dataset.cursor || '0');
            insertAt(text, offset);
            updateLineNumbers();
        });
    });

    function insertAt(text, cursorOffset = 0) {
        const s = editor.selectionStart, e2 = editor.selectionEnd;
        editor.value = editor.value.substring(0, s) + text + editor.value.substring(e2);
        const pos = s + text.length + cursorOffset;
        editor.selectionStart = editor.selectionEnd = pos;
        editor.focus();
        saveState();
    }

    // ── Copy ─────────────────────────────────────────────────────
    document.getElementById('btn-copy').addEventListener('click', () => {
        if (!navigator.clipboard) { showToast('Clipboard not available'); return; }
        navigator.clipboard.writeText(editor.value)
            .then(() => showToast('Copied!'))
            .catch(() => showToast('Copy failed'));
    });

    // ── Paste ────────────────────────────────────────────────────
    document.getElementById('btn-paste').addEventListener('click', () => {
        if (!navigator.clipboard?.readText) { showToast('Clipboard not available'); return; }
        navigator.clipboard.readText()
            .then(text => { insertAt(text); updateLineNumbers(); showToast('Pasted!'); })
            .catch(() => showToast('Paste failed'));
    });

    // ── Format ───────────────────────────────────────────────────
    document.getElementById('btn-format').addEventListener('click', () => {
        saveState();
        let out = '', indent = 0;
        const voids = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
        for (const raw of editor.value.split('\n')) {
            const line = raw.trim();
            if (!line) continue;
            const closing = line.startsWith('</');
            const selfClose = line.endsWith('/>') || voids.has((line.match(/<(\w+)/) || [])[1]);
            if (closing) indent = Math.max(0, indent - 1);
            out += '  '.repeat(indent) + line + '\n';
            if (!closing && !selfClose && line.startsWith('<') && !line.startsWith('<!--')) indent++;
        }
        editor.value = out;
        updateLineNumbers();
        showToast('Formatted!');
    });

    // ── Preview ──────────────────────────────────────────────────
    document.getElementById('btn-preview').addEventListener('click', () => {
        const w = window.open('', '_blank');
        if (!w) { showToast('Pop-ups blocked'); return; }
        w.document.write(editor.value);
        w.document.close();
    });

    // ── Download ─────────────────────────────────────────────────
    document.getElementById('btn-download').addEventListener('click', () => {
        filenameIn.value = '';
        modal.classList.add('open');
        setTimeout(() => filenameIn.focus(), 300);
    });

    document.getElementById('modal-confirm').addEventListener('click', () => {
        const name = filenameIn.value.trim() || 'index.html';
        const blob = new Blob([editor.value], { type: 'text/html' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        modal.classList.remove('open');
        showToast(`Saved as ${name}`);
    });

    document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

    // ── Clear ────────────────────────────────────────────────────
    document.getElementById('btn-clear').addEventListener('click', () => {
        if (!editor.value) return;
        saveState();
        editor.value = '';
        updateLineNumbers();
        showToast('Cleared');
    });

    // ── Toast ────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // ── Init ─────────────────────────────────────────────────────
    updateLineNumbers();
</script>
</body>
</html>
